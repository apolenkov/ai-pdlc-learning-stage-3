schema: spec-driven
context: |
  Синтетический учебный продукт: кредитный калькулятор.
  Все вычисления выполняются в браузере; рабочие и персональные данные запрещены.
  Это самостоятельная ступень 3 с локальными specs и changes. Учебный результат —
  согласованный Change без Apply; существующая main остаётся repo-local.
rules:
  proposal:
    - Объяснять наблюдаемую пользу и границы изменения.
    - Не добавлять банковские правила без источника и отдельного согласования.
  specs:
    - Использовать проверяемые сценарии WHEN/THEN.
    - Указывать поведение для ошибок и нулевой ставки.
    - Не объявлять reset в обоих режимах, переключатель месяца/годы или диапазон суммы текущим поведением до реализации.
  design:
    - Фиксировать обработку данных, тесты и ограничения.
  tasks:
    - Для каждого не реализованного требования сохранять незавершённую задачу и проверку результата.
