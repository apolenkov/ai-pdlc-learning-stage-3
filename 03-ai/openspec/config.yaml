schema: spec-driven
context: |
  Перед любой работой прочитать CONTEXT.md.
  Это синтетический учебный кредитный калькулятор без внешних API и хранения данных.
  ИИ подготавливает черновики и предпроверку; решения принимают люди.
  Результат должен совпадать с другими пятью ступенями.
rules:
  proposal:
    - Объяснять пользу, границы и наблюдаемый результат.
    - Не добавлять новые банковские правила без человеческого решения.
  specs:
    - Использовать сценарии WHEN/THEN.
    - Связывать каждый принятый сценарий с тестом.
  design:
    - Фиксировать поток данных, безопасность, тесты и отклонённые варианты.
    - Сохранять обязательные ревью аналитика и технического специалиста.
